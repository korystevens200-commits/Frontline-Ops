# Deploy Frontline Ops to Fly.io from a browser.
#
# Exists so the deploy needs no laptop: GitHub's runners have flyctl and can
# reach Fly, which a phone cannot. Start it from the Actions tab.
#
# Two repository secrets are required (Settings > Secrets and variables >
# Actions). They are write-only -- nobody, including anyone reading this file,
# can read them back out:
#   FLY_API_TOKEN  - from fly.io/user/personal_access_tokens
#   APP_PASSWORD   - the password you and Isa will type to sign in
#
# Every step checks before it acts, so running this again is safe: it will not
# make a second database or a second app.

name: Deploy to Fly

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Fly app name (must be unused across all of Fly)"
        required: true
        default: "frontline-ops"
      db_name:
        description: "Database name"
        required: true
        default: "frontline-db"
      region:
        description: "Database region (iad = Ashburn VA, the closest one Managed Postgres offers to Miami)"
        required: true
        default: "iad"
      operators:
        description: "Who can sign in, comma separated"
        required: true
        default: "Kory,Isa"
      org:
        description: "Fly organization slug"
        required: true
        default: "personal"
      cluster_id:
        description: "Existing database cluster id (optional — skips the lookup entirely)"
        required: false
        default: ""

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app

    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP:    ${{ inputs.app_name }}
      DB:     ${{ inputs.db_name }}
      REGION: ${{ inputs.region }}
      ORG:    ${{ inputs.org }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the two secrets exist
        run: |
          missing=0
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::FLY_API_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            missing=1
          fi
          if [ -z "${{ secrets.APP_PASSWORD }}" ]; then
            echo "::error::APP_PASSWORD is not set. Add it under Settings > Secrets and variables > Actions."
            missing=1
          fi
          [ "$missing" = "0" ] || exit 1

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create the app if it does not exist
        run: |
          if flyctl apps list --json | grep -q "\"Name\": *\"${APP}\""; then
            echo "App ${APP} already exists."
          else
            echo "Creating app ${APP}..."
            flyctl apps create "${APP}" --org personal
          fi

      - name: Show what this flyctl offers
        # Fly retired unmanaged Postgres mid-flight and the replacement's flags
        # cannot be checked from where this workflow was written. Printing the
        # help first means that if the create below still fails, the log already
        # contains exactly what the correct invocation is.
        run: |
          flyctl version
          echo "===== fly mpg ====="
          flyctl mpg --help 2>&1 || true
          echo "===== fly mpg create ====="
          flyctl mpg create --help 2>&1 || true
          echo "===== fly mpg attach ====="
          flyctl mpg attach --help 2>&1 || true

      - name: Create the database if it does not exist
        # `mpg list` refuses to run without --org on a non-interactive shell
        # ("slug argument must be specified"), so every list call names it.
        # When a cluster is created here its id is captured straight from the
        # output rather than being looked up again afterwards.
        env:
          CLUSTER_ID_INPUT: ${{ inputs.cluster_id }}
        run: |
          set -o pipefail

          if [ -n "${CLUSTER_ID_INPUT}" ]; then
            echo "Using the cluster id given at run time: ${CLUSTER_ID_INPUT}"
            echo "CLUSTER_ID=${CLUSTER_ID_INPUT}" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Existing clusters in ${ORG}:"
          flyctl mpg list --org "${ORG}" || true

          if flyctl mpg list --org "${ORG}" 2>/dev/null | grep -q "${DB}"; then
            echo "Database ${DB} already exists — leaving it alone."
            exit 0
          fi

          echo "Creating Managed Postgres '${DB}' in ${REGION}, plan Basic..."
          CREATE_LOG="$(mktemp)"
          flyctl mpg create \
            --name "${DB}" \
            --region "${REGION}" \
            --org "${ORG}" \
            --plan Basic \
            --pg-major-version 17 2>&1 | tee "${CREATE_LOG}"

          # The create output ends with a summary block containing "  ID: xxxx".
          NEW_ID="$(grep -oE '^[[:space:]]*ID:[[:space:]]*[A-Za-z0-9]+' "${CREATE_LOG}" \
                    | head -1 | awk '{print $2}')"
          if [ -n "${NEW_ID}" ]; then
            echo "Captured cluster id ${NEW_ID} from the create output."
            echo "CLUSTER_ID=${NEW_ID}" >> "$GITHUB_ENV"
          fi

      - name: Connect the database to the app
        # `mpg attach` takes a CLUSTER ID, not a name.
        run: |
          if flyctl secrets list --app "${APP}" | grep -q DATABASE_URL; then
            echo "DATABASE_URL already set — nothing to attach."
            exit 0
          fi

          # CLUSTER_ID may already be set by the step above.
          if [ -z "${CLUSTER_ID:-}" ]; then
            echo "Clusters in ${ORG}:"
            flyctl mpg list --org "${ORG}" || true

            CLUSTER_ID="$(flyctl mpg list --org "${ORG}" --json 2>/dev/null | node -e '
              let raw = "";
              process.stdin.on("data", function (d) { raw += d; });
              process.stdin.on("end", function () {
                var want = process.argv[1];
                try {
                  var parsed = JSON.parse(raw);
                  var rows = Array.isArray(parsed)
                    ? parsed
                    : (parsed.clusters || parsed.data || parsed.Clusters || []);
                  var hit = rows.find(function (r) { return (r.name || r.Name) === want; });
                  process.stdout.write(hit ? String(hit.id || hit.ID || "") : "");
                } catch (e) { /* table parse below */ }
              });
            ' "${DB}")"
          fi

          if [ -z "${CLUSTER_ID:-}" ]; then
            CLUSTER_ID="$(flyctl mpg list --org "${ORG}" 2>/dev/null \
              | awk -v name="${DB}" '$0 ~ name { for (i = 1; i <= NF; i++) if ($i == name) { print $1; exit } }')"
          fi

          if [ -z "${CLUSTER_ID:-}" ]; then
            echo "::error::Could not work out the cluster id for ${DB}."
            echo "::error::Re-run this workflow and put the id in the 'cluster_id' box to skip this lookup."
            exit 1
          fi

          echo "Attaching cluster ${CLUSTER_ID} to ${APP}..."
          flyctl mpg attach "${CLUSTER_ID}" --app "${APP}"

      - name: Set the sign-in secrets
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          OPERATORS: ${{ inputs.operators }}
        run: |
          # hash-password uses only Node built-ins, so nothing to install.
          HASH="$(node scripts/hash-password.js "${APP_PASSWORD}")"

          # SESSION_SECRET must stay the same between deploys -- regenerating it
          # signs everyone out, so it is only created the first time.
          if flyctl secrets list --app "${APP}" | grep -q SESSION_SECRET; then
            echo "Keeping the existing SESSION_SECRET."
            flyctl secrets set --app "${APP}" --stage \
              APP_PASSWORD_HASH="${HASH}" \
              APP_USERS="${OPERATORS}"
          else
            echo "Creating a SESSION_SECRET."
            SESSION_SECRET="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')"
            flyctl secrets set --app "${APP}" --stage \
              APP_PASSWORD_HASH="${HASH}" \
              APP_USERS="${OPERATORS}" \
              SESSION_SECRET="${SESSION_SECRET}"
          fi

      - name: Deploy
        run: flyctl deploy --app "${APP}" --config fly.toml --remote-only

      - name: Check it answers
        run: |
          URL="https://${APP}.fly.dev"
          echo "Waiting for ${URL} to come up..."
          for i in $(seq 1 30); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${URL}/healthz" || true)"
            if [ "${CODE}" = "200" ]; then
              echo "Healthy after ${i} tries."
              echo "### Frontline Ops is live" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Open **${URL}** on your phone and sign in with the password you saved as APP_PASSWORD." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "The dial queue will be empty until a prospect list is imported. That is expected." >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            sleep 10
          done
          echo "::error::The app deployed but is not answering at ${URL}/healthz."
          flyctl logs --app "${APP}" --no-tail | tail -50
          exit 1
