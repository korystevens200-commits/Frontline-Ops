# Run the test suite on every push to main and every pull request.
#
# Postgres 17, matching the Managed Postgres cluster in production. The
# database is a throwaway service container, so the suite's TRUNCATEs can
# never reach real data.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: frontline
          POSTGRES_PASSWORD: frontline
          POSTGRES_DB: frontline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U frontline"
          --health-interval 5s --health-timeout 5s --health-retries 12

    env:
      TEST_DATABASE_URL: postgres://frontline:frontline@localhost:5432/frontline_test
      PGPASSWORD: frontline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Syntax-check every file
        run: for f in $(git ls-files '*.js'); do node --check "$f"; done

      - name: Migrations apply cleanly, and a second run is a no-op
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          node scripts/migrate.js
          node scripts/migrate.js | tee second-run.txt
          grep -q "up to date" second-run.txt

      - name: An existing Phase 1 database upgrades and keeps its data
        run: |
          psql -h localhost -U frontline -d postgres -qc "CREATE DATABASE upgrade_check"
          URL=postgres://frontline:frontline@localhost:5432/upgrade_check
          psql "$URL" -v ON_ERROR_STOP=1 -q -f migrations/001_init.sql
          psql "$URL" -v ON_ERROR_STOP=1 -q <<'SQL'
            CREATE TABLE schema_migrations (filename text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now());
            INSERT INTO schema_migrations (filename) VALUES ('001_init.sql');
            INSERT INTO companies (name, phone, tier) VALUES ('Existing prospect', '+13055550111', 'A');
            INSERT INTO calls (company_id, called_by, outcome) VALUES (1, 'Kory', 'no_answer');
          SQL
          DATABASE_URL="$URL" node scripts/migrate.js
          test "$(psql "$URL" -Atc 'SELECT count(*) FROM companies')" = "1"
          test "$(psql "$URL" -Atc 'SELECT count(*) FROM calls')" = "1"

      - name: Tests
        run: npm test
