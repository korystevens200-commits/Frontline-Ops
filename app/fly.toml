# Frontline Ops command center.
# Deployed from the app/ directory:  fly deploy -c fly.toml
#
# The marketing site at the repository root is a separate, public GitHub Pages
# deploy and is not part of this image.

app = "frontline-ops"
# Was mia. Fly deprecated Miami for new machines mid-deploy:
#   "Region mia is deprecated and cannot have new resources provisioned"
# Fly suggested dfw; iad is the better choice because the Managed Postgres
# cluster lives there, so the app sits beside its data instead of paying a
# cross-region hop on every query. The extra distance to Hialeah costs a few
# milliseconds once per request; the database hop would cost that several
# times over.
primary_region = "iad"

[build]

[deploy]
  # Migrations run once per deploy, before the new machines take traffic. The
  # runner is lock-guarded and idempotent, so a retried release is harmless.
  release_command = "node scripts/migrate.js"
  strategy = "rolling"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Keep one machine warm. A cold start in the middle of a call block is the
  # kind of friction that makes someone stop using the tool.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
